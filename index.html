<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام نقاط البيع - سوبرماركت</title>
    <!-- استدعاء مكتبة PapaParse لقراءة ملفات CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body { display: flex; height: 100vh; background: #f4f7f6; color: #333; overflow: hidden; }
        
        /* قسم الباركود والبحث */
        .products-section { flex: 2; padding: 25px; display: flex; flex-direction: column; justify-content: flex-start; }
        
        .title-area { margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .title-area h2 { color: #2c3e50; font-size: 24px; }
        .status-msg { font-size: 15px; color: #27ae60; font-weight: bold; }

        /* حقل الباركود الرئيسي الضخم والنشط دائماً */
        .barcode-box { margin-bottom: 20px; }
        .barcode-box input { width: 100%; padding: 20px; font-size: 22px; border: 3px solid #27ae60; border-radius: 10px; outline: none; background: #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }

        /* رسالة توجيهية للكاشير */
        .cashier-instruction { background: #e8f8f5; border: 1px solid #27ae60; padding: 20px; border-radius: 8px; text-align: center; color: #27ae60; font-size: 18px; font-weight: bold; margin-top: 10px; }

        /* قسم الفاتورة والسلة (مكبر ليكون مريحاً للعين) */
        .cart-section { flex: 1.2; background: white; border-right: 1px solid #ddd; display: flex; flex-direction: column; padding: 20px; box-shadow: -2px 0 5px rgba(0,0,0,0.05); }
        .cart-title { font-size: 18px; margin-bottom: 15px; color: #2c3e50; border-bottom: 2px solid #f1f1f1; padding-bottom: 8px; }
        .cart-items { flex: 1; overflow-y: auto; margin-bottom: 15px; border-bottom: 1px solid #eee; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px dashed #eee; font-size: 14px; }
        .cart-item-info { flex: 2; }
        .cart-item-controls { display: flex; align-items: center; gap: 8px; }
        .cart-item-controls button { background: #bdc3c7; color: #333; border: none; width: 26px; height: 26px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px; }
        .btn-delete { background: #e74c3c !important; color: white !important; }
        
        /* ملخص الحساب وأزرار الدفع */
        .totals { font-size: 22px; font-weight: bold; margin-bottom: 15px; text-align: left; color: #2c3e50; background: #f8f9fa; padding: 12px; border-radius: 6px; }
        .btn-checkout { background: #27ae60; color: white; border: none; padding: 15px; width: 100%; font-size: 18px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-bottom: 8px; }
        .btn-checkout:hover { background: #219653; }
        .btn-clear { background: #e67e22; color: white; border: none; padding: 10px; width: 100%; font-size: 14px; border-radius: 6px; cursor: pointer; }
        .btn-clear:hover { background: #d35400; }
    </style>
</head>
<body>

    <!-- قسم ماسح الباركود والتعليمات -->
    <div class="products-section">
        <div class="title-area">
            <h2>🛒 نظام نقاط البيع - سوبرماركت</h2>
            <div id="statusMsg" class="status-msg">جاري تحميل المنتجات...</div>
        </div>
        
        <!-- حقل ماسح الباركود الرئيسي والنشط دائماً -->
        <div class="barcode-box">
            <input type="text" id="barcodeInput" placeholder="امسح باركود المنتج هنا أو اكتبه واضغط Enter..." autofocus autocomplete="off">
        </div>

        <div class="cashier-instruction">
            ⚡ نظام جاهز للبيع السريع عبر ماسح الباركود فقط<br>
            <span style="font-size: 13px; color: #555; font-weight: normal; margin-top: 5px; display: inline-block;">قم بمسح أي منتج وسيتم إضافته فوراَ إلى الفاتورة</span>
        </div>
    </div>

    <!-- قسم الفاتورة والسلة -->
    <div class="cart-section">
        <div class="cart-title">فاتورة المبيعات الحالية</div>
        <div class="cart-items" id="cartItems">
            <p style="color: #888; text-align: center; margin-top: 50px; font-size: 15px;">السلة فارغة</p>
        </div>
        <div class="totals">
            الإجمالي: <span id="totalAmount">0.00</span> د.أ
        </div>
        <button class="btn-checkout" onclick="checkout()">إتمام الدفع</button>
        <button class="btn-clear" onclick="clearCart()">إفراغ السلة</button>
    </div>

    <script>
        // رابط الشيت الخاص بك مع كود منع التخزين المؤقت
        const BASE_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRdqgqC3ThQaqVmaShd-47oZ6jEUS1Pf-4lihZbJJh2HijUjkbUMQtxeF7FU8IlpwHG7mst05Marh58/pub?output=csv';
        const SHEET_CSV_URL = BASE_CSV_URL + '&cache_buster=' + new Date().getTime();

        let products = [];
        let cart = [];

        const barcodeInput = document.getElementById('barcodeInput');
        const statusMsg = document.getElementById('statusMsg');

        // جلب المنتجات في الخلفية عند فتح الصفحة
        function loadProductsFromSheet() {
            Papa.parse(SHEET_CSV_URL, {
                download: true,
                header: true,
                complete: function(results) {
                    products = results.data.filter(p => p.barcode && p.name).map(p => ({
                        barcode: String(p.barcode).trim(),
                        name: String(p.name).trim(),
                        price: parseFloat(p.price) || 0
                    }));
                    
                    if (products.length > 0) {
                        statusMsg.innerText = `🟢 متصل: تم تحميل ${products.length} منتج`;
                    } else {
                        statusMsg.innerText = '⚠️ تحذير: الملف فارغ أو الأعمدة غير مطابقة';
                        statusMsg.style.color = '#e74c3c';
                    }
                    focusBarcode();
                },
                error: function(err) {
                    statusMsg.innerText = '❌ خطأ في الاتصال بالشيت';
                    statusMsg.style.color = '#e74c3c';
                }
            });
        }

        // إضافة منتج للسلة بواسطة الباركود
        function addToCartByBarcode(code) {
            const product = products.find(p => p.barcode === code);
            if (!product) {
                alert('⚠️ المنتج غير موجود في النظام بهذا الباركود: ' + code);
                focusBarcode();
                return;
            }

            const existing = cart.find(item => item.barcode === code);
            if (existing) {
                existing.qty++;
            } else {
                cart.push({ ...product, qty: 1 });
            }
            renderCart();
            focusBarcode();
        }

        // التقاط إدخال ماسح الباركود عند الضغط على Enter تلقائياً
        barcodeInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const code = barcodeInput.value.trim();
                if (code !== '') {
                    addToCartByBarcode(code);
                    barcodeInput.value = ''; // تفريغ الحقل فوراً للباركود التالي
                }
            }
        });

        // الحفاظ على المؤشر داخل حقل الباركود طوال الوقت لسرعة العمل
        function focusBarcode() {
            barcodeInput.focus();
        }
        window.addEventListener('click', function() {
            focusBarcode();
        });

        // تعديل الكميات داخل السلة (+ أو -)
        function changeQty(code, delta) {
            const item = cart.find(i => i.barcode === code);
            if (item) {
                item.qty += delta;
                if (item.qty <= 0) {
                    removeFromCart(code);
                } else {
                    renderCart();
                }
            }
            focusBarcode();
        }

        // حذف منتج مفرد من السلة
        function removeFromCart(code) {
            cart = cart.filter(item => item.barcode !== code);
            renderCart();
            focusBarcode();
        }

        // إفراغ السلة بالكامل
        function clearCart() {
            cart = [];
            renderCart();
            focusBarcode();
        }

        // تحديث واجهة الفاتورة وحساب الإجمالي
        function renderCart() {
            const container = document.getElementById('cartItems');
            const totalElement = document.getElementById('totalAmount');
            
            if (cart.length === 0) {
                container.innerHTML = '<p style="color: #888; text-align: center; margin-top: 50px; font-size: 15px;">السلة فارغة</p>';
                totalElement.innerText = '0.00';
                return;
            }

            let total = 0;
            container.innerHTML = cart.map(item => {
                let itemTotal = item.price * item.qty;
                total += itemTotal;
                return `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <b style="font-size:15px; color:#2c3e50;">${item.name}</b><br>
                            <span style="color:#27ae60; font-weight:bold;">${item.price.toFixed(2)} د.أ</span>
                        </div>
                        <div class="cart-item-controls">
                            <button onclick="changeQty('${item.barcode}', -1)">-</button>
                            <span style="width: 25px; text-align: center; font-weight: bold; font-size: 15px;">${item.qty}</span>
                            <button onclick="changeQty('${item.barcode}', 1)">+</button>
                            <button class="btn-delete" onclick="removeFromCart('${item.barcode}')">×</button>
                        </div>
                    </div>
                `;
            }).join('');

            totalElement.innerText = total.toFixed(2);
        }

        // إتمام عملية الدفع وتصفير السلة
        function checkout() {
            if (cart.length === 0) {
                alert('السلة فارغة!');
                return;
            }
            alert('✅ تم إتمام عملية البيع بنجاح!');
            cart = [];
            renderCart();
            focusBarcode();
        }

        // التشغيل التلقائي عند فتح الصفحة
        window.onload = function() {
            loadProductsFromSheet();
        };
    </script>
</body>
</html>
