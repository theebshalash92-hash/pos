<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فاحص الأسعار - Price Checker</title>
    <!-- مكتبة قراءة الباركود عبر الكاميرا -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f4f9; text-align: center; margin: 0; padding: 20px; }
        h1 { color: #333; font-size: 24px; }
        #reader { width: 100%; max-width: 400px; margin: auto; border-radius: 10px; overflow: hidden; }
        .result-card { background: #fff; max-width: 400px; margin: 20px auto; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: none; }
        .result-card img { width: 150px; height: 150px; object-fit: contain; border-radius: 8px; margin-bottom: 10px; }
        .product-name { font-size: 20px; font-weight: bold; color: #222; margin-bottom: 10px; }
        .product-price { font-size: 26px; color: #e74c3c; font-weight: bold; }
        .error-msg { color: #e74c3c; font-weight: bold; margin-top: 15px; display: none; }
    </style>
</head>
<body>

    <h1>🛒 فحص أسعار المنتجات</h1>
    <p>وجه كاميرا الهاتف نحو باركود المنتج لمعرفة السعر</p>

    <!-- مكان عرض الكاميرا -->
    <div id="reader"></div>

    <p id="loading" style="display:none; color: #007bff;">جاري البحث عن المنتج...</p>
    <p id="error" class="error-msg">المنتج غير متوفر في النظام!</p>

    <!-- كارت عرض النتيجة -->
    <div id="resultCard" class="result-card">
        <img id="pImg" src="" alt="صورة المنتج">
        <div id="pName" class="product-name">اسم المنتج</div>
        <div id="pPrice" class="product-price">0.00 د.أ</div>
    </div>

    <script>
        const SCRIPT_URL = 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE'; // ضع رابط الـ Web App هنا

        let lastScannedCode = "";

        function onScanSuccess(decodedText, decodedResult) {
            if (decodedText === lastScannedCode) return; // منع التكرار السريع لنفس الباركود
            lastScannedCode = decodedText;

            console.log(`تم قراءة الباركود: ${decodedText}`);
            fetchProductData(decodedText);
        }

        function fetchProductData(barcode) {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('resultCard').style.display = 'none';
            document.getElementById('error').style.display = 'none';

            fetch(`${SCRIPT_URL}?barcode=${barcode}`)
                .then(response => response.json())
                .then(data => {
                    document.getElementById('loading').style.display = 'none';
                    if (data.found) {
                        document.getElementById('pName').innerText = data.name;
                        document.getElementById('pPrice').innerText = data.price;
                        document.getElementById('pImg').src = data.image || 'https://via.placeholder.com/150';
                        document.getElementById('resultCard').style.display = 'block';
                        
                        // إعادة السماح بقراءة نفس الباركود بعد 4 ثواني
                        setTimeout(() => { lastScannedCode = ""; }, 4000);
                    } else {
                        document.getElementById('error').style.display = 'block';
                        setTimeout(() => { lastScannedCode = ""; }, 3000);
                    }
                })
                .catch(error => {
                    document.getElementById('loading').style.display = 'none';
                    alert("حدث خطأ في الاتصال بالخادم");
                    lastScannedCode = "";
                });
        }

        // تشغيل الكاميرا الخلفية تلقائياً
        let html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", { fps: 10, qrbox: { width: 250, height: 150 } }, false);
        html5QrcodeScanner.render(onScanSuccess);
    </script>
</body>
</html>
