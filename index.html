<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فاحص الأسعار - Price Checker</title>
    <!-- مكتبة قراءة الباركود عبر الكاميرا -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f4f9; text-align: center; margin: 0; padding: 20px; }
        h1 { color: #333; font-size: 24px; margin-bottom: 5px; }
        p { color: #666; }
        #reader { width: 100%; max-width: 400px; margin: 20px auto; border-radius: 12px; overflow: hidden; background: #fff; padding: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .result-card { background: #fff; max-width: 400px; margin: 20px auto; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: none; text-align: center; }
        .result-card img { width: 160px; height: 160px; object-fit: contain; border-radius: 8px; margin-bottom: 15px; background: #fff; border: 1px solid #eee; }
        .product-name { font-size: 22px; font-weight: bold; color: #222; margin-bottom: 12px; }
        .product-price { font-size: 28px; color: #e74c3c; font-weight: bold; }
        .error-msg { color: #e74c3c; font-weight: bold; margin-top: 15px; display: none; font-size: 18px; background: #ffe6e6; padding: 10px; border-radius: 8px; max-width: 400px; margin-left: auto; margin-right: auto; }
        .loading-msg { color: #007bff; font-weight: bold; margin-top: 15px; display: none; font-size: 18px; }
    </style>
</head>
<body>

    <h1>🛒 فحص أسعار المنتجات</h1>
    <p>وجه كاميرا الهاتف نحو باركود المنتج لعرض السعر</p>

    <!-- مكان عرض الكاميرا -->
    <div id="reader"></div>

    <div id="loading" class="loading-msg">جاري البحث عن المنتج...</div>
    <div id="error" class="error-msg">المنتج غير متوفر في النظام!</div>

    <!-- كارت عرض النتيجة -->
    <div id="resultCard" class="result-card">
        <img id="pImg" src="" alt="صورة المنتج">
        <div id="pName" class="product-name">اسم المنتج</div>
        <div id="pPrice" class="product-price">0.00 د.أ</div>
    </div>

    <script>
        // رابط الـ Google Apps Script الخاص بك المربوط بجوجل شيت
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwTb0M9RtjDZadW_Vwx3T_f7RPWY_0ZVoJbWUbeRt-3BMV2BzZXPUPn3VxhSeINle8clg/exec';

        let lastScannedCode = "";

        function onScanSuccess(decodedText, decodedResult) {
            if (decodedText === lastScannedCode) return; // منع التكرار السريع لنفس الباركود
            lastScannedCode = decodedText;

            console.log(`تم قراءة الباركود: ${decodedText}`);
            fetchProductData(decodedText);
        }

        function fetchProductData(barcode) {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('resultCard').style.display = 'none';
            document.getElementById('error').style.display = 'none';

            fetch(`${SCRIPT_URL}?barcode=${encodeURIComponent(barcode)}`)
                .then(response => response.json())
                .then(data => {
                    document.getElementById('loading').style.display = 'none';
                    if (data.found) {
                        document.getElementById('pName').innerText = data.name;
                        document.getElementById('pPrice').innerText = data.price + " د.أ";
                        document.getElementById('pImg').src = data.image && data.image.trim() !== "" ? data.image : 'https://via.placeholder.com/150?text=No+Image';
                        document.getElementById('resultCard').style.display = 'block';
                        
                        // إعادة السماح بقراءة نفس الباركود بعد 4 ثوانٍ
                        setTimeout(() => { lastScannedCode = ""; }, 4000);
                    } else {
                        document.getElementById('error').style.display = 'block';
                        setTimeout(() => { lastScannedCode = ""; }, 3000);
                    }
                })
                .catch(error => {
                    document.getElementById('loading').style.display = 'none';
                    alert("حدث خطأ في الاتصال بالخادم");
                    lastScannedCode = "";
                });
        }

        // تشغيل الكاميرا الخلفية تلقائياً
        let html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", { 
                fps: 10, 
                qrbox: { width: 260, height: 140 },
                aspectRatio: 1.0
            }, false);
        html5QrcodeScanner.render(onScanSuccess);
    </script>
</body>
</html>
