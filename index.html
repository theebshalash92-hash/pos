<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فاحص الأسعار - Price Checker</title>
    <!-- مكتبة قراءة الباركود عبر الكاميرا -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <!-- مكتبة قراءة شت الإكسل CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body { background: #f0f2f5; color: #333; display: flex; flex-direction: column; min-height: 100vh; padding: 15px; }
        
        .header { text-align: center; margin-bottom: 15px; }
        .header h2 { color: #2c3e50; font-size: 20px; margin-bottom: 5px; }
        .status-badge { font-size: 13px; color: #27ae60; font-weight: bold; }

        /* حاوية الكاميرا */
        #reader { width: 100%; max-width: 400px; margin: 0 auto 15px auto; border-radius: 12px; overflow: hidden; border: 2px solid #cbd5e1; background: #000; }

        /* بطاقة نتيجة فحص السعر */
        .result-card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); text-align: center; max-width: 400px; width: 100%; margin: 0 auto; flex: 1; display: flex; flex-direction: column; justify-content: center; }
        
        .product-name { font-size: 22px; font-weight: bold; color: #1e293b; margin-bottom: 15px; min-height: 60px; display: flex; align-items: center; justify-content: center; }
        
        .price-box { background: #e8f8f5; border: 2px dashed #27ae60; border-radius: 10px; padding: 15px; margin-bottom: 20px; }
        .price-label { font-size: 14px; color: #64748b; margin-bottom: 5px; }
        .product-price { font-size: 36px; font-weight: bold; color: #27ae60; direction: ltr; }

        .btn-reset { background: #2980b9; color: white; border: none; padding: 14px; width: 100%; font-size: 16px; border-radius: 8px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .btn-reset:active { background: #2471a3; transform: scale(0.98); }

        .footer-note { text-align: center; font-size: 12px; color: #888; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="header">
        <h2>🔍 فاحص أسعار المواد (Price Checker)</h2>
        <div id="statusMsg" class="status-badge">جاري تحميل قاعدة البيانات...</div>
    </div>

    <!-- نافذة الكاميرا -->
    <div id="reader"></div>

    <!-- عرض النتيجة -->
    <div class="result-card">
        <div id="productName" class="product-name">قم بتوجيه الكاميرا نحو باركود المنتج</div>
        
        <div class="price-box">
            <div class="price-label">السعر المطلوب</div>
            <div id="productPrice" class="product-price">0.00 د.أ</div>
        </div>

        <button class="btn-reset" onclick="restartScanner()">📷 مسح منتج آخر</button>
    </div>

    <div class="footer-note">
        برمجة: ذيب الشلش | سوبرماركت نسمة الجبل
    </div>

    <script>
        const BASE_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRdqgqC3ThQaqVmaShd-47oZ6jEUS1Pf-4lihZbJJh2HijUjkbUMQtxeF7FU8IlpwHG7mst05Marh58/pub?output=csv';
        const SHEET_CSV_URL = BASE_CSV_URL + '&cache_buster=' + new Date().getTime();

        let productsMap = {};
        let html5QrCode;
        let isScanning = true;

        // تحميل المنتجات من شت الإكسل
        function loadProducts() {
            Papa.parse(SHEET_CSV_URL, {
                download: true,
                header: true,
                complete: function(results) {
                    let count = 0;
                    results.data.forEach(p => {
                        if (p.barcode && p.name) {
                            productsMap[String(p.barcode).trim()] = {
                                name: String(p.name).trim(),
                                price: parseFloat(p.price) || 0
                            };
                            count++;
                        }
                    });

                    if (count > 0) {
                        document.getElementById('statusMsg.innerText').innerText = ''; // حماية بسيطة
                        document.getElementById('statusMsg').innerText = `🟢 المتجر متصل (${count} منتج جاهز)`;
                        initScanner();
                    } else {
                        document.getElementById('statusMsg').innerText = '⚠️ تحذير: لم يتم العثور على منتجات';
                        document.getElementById('statusMsg').style.color = '#e74c3c';
                    }
                },
                error: function(err) {
                    document.getElementById('statusMsg').innerText = '❌ خطأ في الاتصال بقاعدة البيانات';
                    document.getElementById('statusMsg.style.color').style.color = '#e74c3c';
                }
            });
        }

        // تشغيل كاميرا الموبايل للباركود
        function initScanner() {
            html5QrCode = new Html5Qrcode("reader");
            const config = { fps: 10, qrbox: { width: 250, height: 150 } };

            html5QrCode.start(
                { facingMode: "environment" }, // استخدام الكاميرا الخلفية للموبايل
                config,
                onScanSuccess,
                onScanFailure
            ).catch(err => {
                console.error("تعذر فتح الكاميرا", err);
                document.getElementById('statusMsg').innerText = '❌ يرجى السماح للمتصفح بالوصول إلى الكاميرا';
                document.getElementById('statusMsg').style.color = '#e74c3c';
            });
        }

        // عند قراءة الباركود بنجاح
        function onScanSuccess(decodedText) {
            if (!isScanning) return;

            let cleanCode = decodedText.trim();
            let product = productsMap[cleanCode];

            const nameEl = document.getElementById('productName');
            const priceEl = document.getElementById('productPrice');

            if (product) {
                nameEl.innerText = product.name;
                priceEl.innerText = product.price.toFixed(2) + ' د.أ';
                playBeep(); // صوت تنبيه نجاح القراءة
            } else {
                nameEl.innerText = '⚠️ المنتج غير موجود في النظام\n(باركود: ' + cleanCode + ')';
                priceEl.innerText = '0.00 د.أ';
            }

            // إيقاف المسح مؤقتاً لحين الضغط على زر مسح منتج آخر
            isScanning = false;
            html5QrCode.pause();
        }

        function onScanFailure(error) {
            // تتجاهل الأخطاء البسيطة أثناء مححثة البحث عن الباركود لتجنب إزعاج الكونسول
        }

        // زر إعادة تشغيل الكاميرا للمنتج التالي
        function restartScanner() {
            document.getElementById('productName').innerText = 'قم بتوجيه الكاميرا نحو باركود المنتج';
            document.getElementById('productPrice').innerText = '0.00 د.أ';
            isScanning = true;
            html5QrCode.resume();
        }

        // صوت صفير قصير عند قراءة المنتج
        function playBeep() {
            try {
                let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let oscillator = audioCtx.createOscillator();
                let gainNode = audioCtx.createGain();
                oscillator.type = 'sine';
                oscillator.frequency.value = 800;
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.1);
            } catch(e) {}
        }

        window.onload = function() {
            loadProducts();
        };
    </script>
</body>
</html>
